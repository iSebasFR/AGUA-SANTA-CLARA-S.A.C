name: .NET Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agua_ht13_test
          POSTGRES_PASSWORD: ht13_ci_temporal
          POSTGRES_DB: aguasantaclara_ht13_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agua_ht13_test -d aguasantaclara_ht13_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore AguaSantaClara.slnx

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install diff-cover
        run: python -m pip install diff-cover

      - name: Run tests with coverage
        env:
          HT13_TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=aguasantaclara_ht13_test;Username=agua_ht13_test;Password=ht13_ci_temporal"
        run: dotnet test AguaSantaClara.slnx --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity normal

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-ht13
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Require 70% coverage on changed application code
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA="origin/main"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          coverage_file="$(find TestResults -name coverage.cobertura.xml -print -quit)"

          if [[ -z "$coverage_file" ]]; then
            echo "No se encontro el reporte de cobertura."
            exit 1
          fi

          if git diff --quiet "$BASE_SHA"...HEAD -- AguaSantaClara.Web; then
            echo "No hay cambios en el codigo de la aplicacion."
            exit 0
          fi

          diff-cover "$coverage_file" \
            --compare-branch="$BASE_SHA" \
            --ignore-whitespace \
            --fail-under=70 \
            --include "AguaSantaClara.Web/*.cs" "AguaSantaClara.Web/**/*.cs"

      - name: Require 80% coverage on changed business logic
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          coverage_file="$(find TestResults -name coverage.cobertura.xml -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "Cobertura report was not generated."
            exit 1
          fi

          if git diff --quiet "$BASE_SHA"...HEAD -- AguaSantaClara.Web/Services; then
            echo "No service logic changes to check."
            exit 0
          fi

          diff-cover "$coverage_file" --compare-branch="$BASE_SHA" --fail-under=80 --include "AguaSantaClara.Web/Services/**/*.cs"